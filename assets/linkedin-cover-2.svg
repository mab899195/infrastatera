<svg width="1584" height="396" viewBox="0 0 1584 396" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M 52 0 L 0 0 0 52" fill="none" stroke="#191820" stroke-width="0.5" stroke-opacity="0.035"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#F7F7F7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bgGrad)"/>
  <rect width="1584" height="396" fill="url(#grid)"/>

  <!-- Left red accent bar -->
  <rect x="0" y="0" width="5" height="396" fill="#FF3008"/>

  <!-- Subtle watermark hexagons left -->
  <g opacity="0.04">
    <polygon points="90,38 170,84 170,176 90,222 10,176 10,84"
             stroke="#191820" stroke-width="2" fill="none"/>
  </g>

  <!-- Logo hexagon -->
  <g transform="translate(320, 138)">
    <polygon points="60,2 110,31 110,91 60,120 10,91 10,31" fill="#FF3008"/>
    <rect x="28" y="27" width="64" height="14" rx="5" fill="white"/>
    <rect x="46" y="41" width="28" height="38" rx="4" fill="white"/>
    <rect x="28" y="79" width="64" height="14" rx="5" fill="white"/>
  </g>

  <!-- Brand name -->
  <text x="458" y="195"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, system-ui, sans-serif"
        font-size="66" font-weight="800" fill="#191820" letter-spacing="-2">Infra<tspan fill="#FF3008">Statera</tspan></text>

  <!-- Category label -->
  <text x="461" y="228"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, system-ui, sans-serif"
        font-size="12.5" font-weight="700" fill="#FF3008" letter-spacing="3">CABINET DE CONSEIL  ·  BTP &amp; INFRASTRUCTURES</text>

  <!-- Separator -->
  <rect x="461" y="250" width="600" height="1" fill="#191820" fill-opacity="0.08"/>

  <!-- Tagline -->
  <text x="461" y="286"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, system-ui, sans-serif"
        font-size="23" font-weight="400" fill="#555555">L’équilibre technologique</text>
  <text x="461" y="318"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, system-ui, sans-serif"
        font-size="23" font-weight="400" fill="#555555">au service de la construction.</text>

  <!-- Website -->
  <text x="461" y="358"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, system-ui, sans-serif"
        font-size="13" font-weight="500" fill="#AAAAAA" letter-spacing="0.5">infrastatera.com</text>

</svg>