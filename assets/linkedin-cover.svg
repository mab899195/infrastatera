<svg width="1584" height="396" viewBox="0 0 1584 396" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M 52 0 L 0 0 0 52" fill="none" stroke="#191820" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#F7F7F7"/>
    </linearGradient>
    <linearGradient id="pylonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#CCCCCC" stop-opacity="1"/>
      <stop offset="100%" stop-color="#CCCCCC" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="rightTint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFF0ED" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFF0ED" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bgGrad)"/>
  <rect width="1584" height="396" fill="url(#grid)"/>
  <rect x="820" width="764" height="396" fill="url(#rightTint)"/>

  <!-- Left red accent bar -->
  <rect x="0" y="0" width="5" height="396" fill="#FF3008"/>

  <!-- ── LOGO HEXAGON ─────────────────────────── -->
  <g transform="translate(52, 138)">
    <polygon points="60,2 110,31 110,91 60,120 10,91 10,31" fill="#FF3008"/>
    <rect x="28" y="27" width="64" height="14" rx="5" fill="white"/>
    <rect x="46" y="41" width="28" height="38" rx="4" fill="white"/>
    <rect x="28" y="79" width="64" height="14" rx="5" fill="white"/>
  </g>

  <!-- ── BRAND NAME ──────────────────────────── -->
  <text x="188" y="195"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="66" font-weight="800" fill="#191820" letter-spacing="-2">Infra<tspan fill="#FF3008">Statera</tspan></text>

  <!-- Category label -->
  <text x="191" y="228"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="12.5" font-weight="700" fill="#FF3008" letter-spacing="3.5">CABINET DE CONSEIL  ·  BTP &amp; INFRASTRUCTURES</text>

  <!-- Separator -->
  <rect x="191" y="250" width="480" height="1" fill="#191820" fill-opacity="0.08"/>

  <!-- Tagline -->
  <text x="191" y="288"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="23" font-weight="400" fill="#555555">L'équilibre technologique au service de la construction.</text>

  <!-- Website -->
  <text x="191" y="352"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="13" font-weight="500" fill="#AAAAAA" letter-spacing="0.5">infrastatera.com</text>

  <!-- ── VERTICAL SEPARATOR ─────────────────── -->
  <line x1="752" y1="48" x2="752" y2="348" stroke="#191820" stroke-opacity="0.06" stroke-width="1"/>

  <!-- ── SUSPENSION BRIDGE ───────────────────── -->

  <!-- Road deck -->
  <rect x="838" y="282" width="700" height="4" rx="2" fill="url(#pylonGrad)"/>

  <!-- Left pylon -->
  <rect x="972" y="88" width="9" height="198" rx="4" fill="url(#pylonGrad)"/>
  <!-- Right pylon -->
  <rect x="1282" y="88" width="9" height="198" rx="4" fill="url(#pylonGrad)"/>

  <!-- Main catenary cable -->
  <path d="M 976 95 Q 1129 178 1286 95"
        stroke="#CCCCCC" stroke-width="2" fill="none"/>

  <!-- Left pylon cables -->
  <line x1="976" y1="95"  x2="844"  y2="284" stroke="#DDDDDD" stroke-width="1.2"/>
  <line x1="976" y1="95"  x2="886"  y2="284" stroke="#DDDDDD" stroke-width="1.2"/>
  <line x1="976" y1="95"  x2="924"  y2="284" stroke="#DDDDDD" stroke-width="1.2"/>
  <line x1="976" y1="95"  x2="962"  y2="284" stroke="#DDDDDD" stroke-width="1.2"/>
  <line x1="976" y1="95"  x2="1012" y2="284" stroke="#DDDDDD" stroke-width="1.2"/>
  <line x1="976" y1="95"  x2="1055" y2="284" stroke="#DDDDDD" stroke-width="1.2"/>
  <line x1="976" y1="95"  x2="1100" y2="284" stroke="#DDDDDD" stroke-width="1.2"/>

  <!-- Right pylon cables -->
  <line x1="1286" y1="95" x2="1534" y2="284" stroke="#DDDDDD" stroke-width="1.2"/>
  <line x1="1286" y1="95" x2="1492" y2="284" stroke="#DDDDDD" stroke-width="1.2"/>
  <line x1="1286" y1="95" x2="1450" y2="284" stroke="#DDDDDD" stroke-width="1.2"/>
  <line x1="1286" y1="95" x2="1408" y2="284" stroke="#DDDDDD" stroke-width="1.2"/>
  <line x1="1286" y1="95" x2="1362" y2="284" stroke="#DDDDDD" stroke-width="1.2"/>
  <line x1="1286" y1="95" x2="1316" y2="284" stroke="#DDDDDD" stroke-width="1.2"/>
  <line x1="1286" y1="95" x2="1160" y2="284" stroke="#DDDDDD" stroke-width="1.2"/>

  <!-- Pylon top caps (red) -->
  <circle cx="976"  cy="90" r="8" fill="#FF3008"/>
  <circle cx="1286" cy="90" r="8" fill="#FF3008"/>

  <!-- Deck anchor nodes -->
  <circle cx="844"  cy="284" r="3.5" fill="#CCCCCC"/>
  <circle cx="886"  cy="284" r="3.5" fill="#CCCCCC"/>
  <circle cx="924"  cy="284" r="3.5" fill="#CCCCCC"/>
  <circle cx="962"  cy="284" r="3.5" fill="#CCCCCC"/>
  <circle cx="1012" cy="284" r="3.5" fill="#CCCCCC"/>
  <circle cx="1055" cy="284" r="3.5" fill="#CCCCCC"/>
  <circle cx="1100" cy="284" r="3.5" fill="#CCCCCC"/>
  <circle cx="1160" cy="284" r="3.5" fill="#CCCCCC"/>
  <circle cx="1316" cy="284" r="3.5" fill="#CCCCCC"/>
  <circle cx="1362" cy="284" r="3.5" fill="#CCCCCC"/>
  <circle cx="1408" cy="284" r="3.5" fill="#CCCCCC"/>
  <circle cx="1450" cy="284" r="3.5" fill="#CCCCCC"/>
  <circle cx="1492" cy="284" r="3.5" fill="#CCCCCC"/>
  <circle cx="1534" cy="284" r="3.5" fill="#CCCCCC"/>

  <!-- ── IoT NODE CLUSTERS ────────────────────── -->
  <circle cx="832"  cy="148" r="4"   fill="#FF3008" fill-opacity="0.65"/>
  <circle cx="868"  cy="122" r="3"   fill="#FF3008" fill-opacity="0.45"/>
  <circle cx="856"  cy="176" r="2.5" fill="#FF3008" fill-opacity="0.4"/>
  <line x1="832" y1="148" x2="868" y2="122" stroke="#FF3008" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="832" y1="148" x2="856" y2="176" stroke="#FF3008" stroke-opacity="0.2" stroke-width="1"/>

  <circle cx="1360" cy="158" r="4"   fill="#FF3008" fill-opacity="0.55"/>
  <circle cx="1400" cy="134" r="3"   fill="#FF3008" fill-opacity="0.4"/>
  <circle cx="1440" cy="170" r="2.5" fill="#FF3008" fill-opacity="0.35"/>
  <circle cx="1480" cy="128" r="3.5" fill="#FF3008" fill-opacity="0.45"/>
  <line x1="1360" y1="158" x2="1400" y2="134" stroke="#FF3008" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="1400" y1="134" x2="1440" y2="170" stroke="#FF3008" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="1440" y1="170" x2="1480" y2="128" stroke="#FF3008" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="1400" y1="134" x2="1480" y2="128" stroke="#FF3008" stroke-opacity="0.1"  stroke-width="1"/>

  <!-- ── WATERMARK HEXAGONS ────────────────────── -->
  <g transform="translate(1490, 28)" opacity="0.06">
    <polygon points="46,0 80,21 80,63 46,84 12,63 12,21"
             stroke="#191820" stroke-width="2" fill="none"/>
  </g>
  <g transform="translate(785, 290)" opacity="0.05">
    <polygon points="36,0 62,16 62,50 36,66 10,50 10,16"
             stroke="#191820" stroke-width="1.5" fill="none"/>
  </g>

</svg>
